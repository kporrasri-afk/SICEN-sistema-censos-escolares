<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICEN — Técnico DAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <nav class="navbar-sicen d-flex align-items-center justify-content-between" role="navigation" aria-label="Barra de navegación principal">
    <span class="navbar-brand-text">📋 SICEN</span>
    <div class="d-flex align-items-center gap-3">
      <span id="nombreUsuario" style="font-size:0.9rem;color:var(--color-texto-suave);"></span>
      <span class="badge" style="background:#E1F5EE;color:#0F6E56;font-size:0.78rem;padding:0.3rem 0.7rem;border-radius:20px;">
        Técnico DAE
      </span>
      <button onclick="window.SICEN.cerrarSesion()" class="btn btn-sm btn-outline-secondary" aria-label="Cerrar sesión">
        Salir
      </button>
    </div>
  </nav>

  <div class="dashboard-layout">

    <aside class="sidebar" aria-label="Menú lateral">
      <div class="sidebar__rol">
        <div class="sidebar__rol-label">Rol activo</div>
        <div class="sidebar__rol-nombre">Técnico DAE</div>
      </div>
      <nav>
        <button class="sidebar__nav-item active" aria-current="page">
          <span class="icon">🏠</span> Inicio
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📥</span> Por revisar
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">✅</span> Aceptados
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">🔄</span> Devueltos
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📋</span> Informes
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <h1 class="page-titulo">Seguimiento técnico</h1>
      <p class="page-subtitulo">Revisión de formularios censales enviados por los centros educativos</p>

      <div class="row g-3 mb-4">
        <div class="col-sm-4">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Por revisar</div>
              <span class="stat-card__icon">📥</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Aceptados</div>
              <span class="stat-card__icon">✅</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
        <div class="col-sm-4">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Devueltos</div>
              <span class="stat-card__icon">🔄</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
      </div>

      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom" style="padding: 1rem 1.25rem;">
          <h2 style="font-size:1rem;font-weight:600;margin:0;">Formularios enviados — pendientes de revisión</h2>
        </div>
        <div class="card-body">
          <div class="text-center py-4" style="color:var(--color-texto-suave);">
            <div style="font-size:2rem;margin-bottom:0.5rem;">📬</div>
            <p style="font-size:0.9rem;margin:0;">No hay formularios pendientes de revisión.</p>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (function () {
      const usuario = window.SICEN?.obtenerUsuario();
      if (!usuario || usuario.rol !== "tecnico_dae") {
        window.location.href = "/index.html";
        return;
      }
      document.getElementById("nombreUsuario").textContent = usuario.nombre;
    })();
  </script>
</body>
</html>
