<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICEN — Director del Centro Educativo</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <nav class="navbar-sicen d-flex align-items-center justify-content-between" role="navigation" aria-label="Barra de navegación principal">
    <span class="navbar-brand-text">📋 SICEN</span>
    <div class="d-flex align-items-center gap-3">
      <span id="nombreUsuario" style="font-size:0.9rem;color:var(--color-texto-suave);"></span>
      <span class="badge" style="background:#FAEEDA;color:#854F0B;font-size:0.78rem;padding:0.3rem 0.7rem;border-radius:20px;">
        Director CE
      </span>
      <button onclick="window.SICEN.cerrarSesion()" class="btn btn-sm btn-outline-secondary" aria-label="Cerrar sesión">
        Salir
      </button>
    </div>
  </nav>

  <div class="dashboard-layout">

    <aside class="sidebar" aria-label="Menú lateral">
      <div class="sidebar__rol">
        <div class="sidebar__rol-label">Rol activo</div>
        <div class="sidebar__rol-nombre">Director CE</div>
      </div>
      <nav>
        <button class="sidebar__nav-item active" aria-current="page">
          <span class="icon">🏠</span> Mis censos
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📝</span> Llenar formulario
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📤</span> Enviados
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">🔄</span> Devueltos
        </button>
      </nav>
    </aside>

    <main class="main-content">
      <h1 class="page-titulo">Mis censos asignados</h1>
      <p class="page-subtitulo">Formularios censales de tu centro educativo</p>

      <!-- Tabla de censos -->
      <div class="card border-0 shadow-sm">
        <div class="card-body p-0">
          <table class="table table-hover mb-0" aria-label="Lista de censos asignados">
            <thead>
              <tr style="background:#F9FAFB;font-size:0.82rem;color:var(--color-texto-suave);">
                <th class="ps-3 py-3 fw-500" scope="col">Censo</th>
                <th class="py-3 fw-500" scope="col">Periodo</th>
                <th class="py-3 fw-500" scope="col">Vencimiento</th>
                <th class="py-3 fw-500" scope="col">Estado</th>
                <th class="py-3 fw-500" scope="col">Acción</th>
              </tr>
            </thead>
            <tbody id="tablaCensos">
              <tr>
                <td colspan="5" class="text-center py-5" style="color:var(--color-texto-suave);">
                  <div style="font-size:2rem;margin-bottom:0.5rem;">📬</div>
                  <p style="font-size:0.9rem;margin:0;">No tenés censos asignados aún.</p>
                </td>
              </tr>
            </tbody>
          </table>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    (function () {
      const usuario = window.SICEN?.obtenerUsuario();
      if (!usuario || usuario.rol !== "director_ce") {
        window.location.href = "/index.html";
        return;
      }
      document.getElementById("nombreUsuario").textContent = usuario.nombre;
    })();
  </script>
</body>
</html>
