<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICEN — Jefatura DAE</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="../css/styles.css" />
</head>
<body>

  <!-- Navbar -->
  <nav class="navbar-sicen d-flex align-items-center justify-content-between" role="navigation" aria-label="Barra de navegación principal">
    <span class="navbar-brand-text">📋 SICEN</span>
    <div class="d-flex align-items-center gap-3">
      <span id="nombreUsuario" style="font-size:0.9rem;color:var(--color-texto-suave);"></span>
      <span class="badge" style="background:#E6F1FB;color:#185FA5;font-size:0.78rem;padding:0.3rem 0.7rem;border-radius:20px;">
        Jefatura DAE
      </span>
      <button onclick="window.SICEN.cerrarSesion()" class="btn btn-sm btn-outline-secondary" aria-label="Cerrar sesión">
        Salir
      </button>
    </div>
  </nav>

  <!-- Layout principal -->
  <div class="dashboard-layout">

    <!-- Sidebar -->
    <aside class="sidebar" aria-label="Menú lateral">
      <div class="sidebar__rol">
        <div class="sidebar__rol-label">Rol activo</div>
        <div class="sidebar__rol-nombre">Jefatura DAE</div>
      </div>
      <nav>
        <button class="sidebar__nav-item active" aria-current="page">
          <span class="icon">🏠</span> Inicio
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📝</span> Formularios
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📊</span> Censos activos
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">👥</span> Colaboradores
        </button>
        <button class="sidebar__nav-item">
          <span class="icon">📋</span> Informes
        </button>
      </nav>
    </aside>

    <!-- Contenido principal -->
    <main class="main-content" id="contenidoPrincipal">
      <h1 class="page-titulo">Bienvenida, <span id="nombreBienvenida">—</span></h1>
      <p class="page-subtitulo">Panel de administración de censos escolares — MEP</p>

      <!-- Estadísticas resumen -->
      <div class="row g-3 mb-4">
        <div class="col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Censos activos</div>
              <span class="stat-card__icon">📊</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Formularios enviados</div>
              <span class="stat-card__icon">📤</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Pendientes de revisión</div>
              <span class="stat-card__icon">⏳</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
        <div class="col-sm-6 col-lg-3">
          <div class="stat-card">
            <div class="d-flex justify-content-between align-items-start mb-2">
              <div class="stat-card__label">Centros registrados</div>
              <span class="stat-card__icon">🏫</span>
            </div>
            <div class="stat-card__valor">0</div>
          </div>
        </div>
      </div>

      <!-- Censos recientes -->
      <div class="card border-0 shadow-sm">
        <div class="card-header bg-white border-bottom d-flex justify-content-between align-items-center" style="padding: 1rem 1.25rem;">
          <h2 style="font-size:1rem;font-weight:600;margin:0;">Censos recientes</h2>
          <button class="btn btn-sm" style="background:var(--color-primario);color:white;border-radius:6px;font-size:0.83rem;">
            + Nuevo censo
          </button>
        </div>
        <div class="card-body p-0">
          <div class="text-center py-5" style="color:var(--color-texto-suave);">
            <div style="font-size:2.5rem;margin-bottom:0.75rem;">📋</div>
            <p style="font-size:0.9rem;margin:0;">No hay censos creados aún.</p>
            <p style="font-size:0.83rem;color:#9CA3AF;margin:0.25rem 0 0;">
              Creá el primer censo para comenzar.
            </p>
          </div>
        </div>
      </div>

    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="../js/auth.js"></script>
  <script>
    // Verificar sesión activa y cargar datos del usuario
    (function () {
      const usuario = window.SICEN?.obtenerUsuario();
      if (!usuario || usuario.rol !== "jefatura_dae") {
        window.location.href = "/index.html";
        return;
      }
      document.getElementById("nombreUsuario").textContent = usuario.nombre;
      document.getElementById("nombreBienvenida").textContent = usuario.nombre.split(" ")[0];
    })();
  </script>
</body>
</html>
