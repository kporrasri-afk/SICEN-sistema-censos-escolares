<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>SICEN — Inicio de sesión</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" />
  <link rel="stylesheet" href="css/styles.css" />
  <meta name="description" content="Sistema de Gestión de Censos Escolares — MEP" />
</head>
<body>

  <div class="login-wrapper" role="main">

    <!-- Panel izquierdo: branding -->
    <div class="login-brand" aria-hidden="true">
      <div class="login-brand__logo">📋</div>
      <div class="login-brand__nombre">SICEN</div>
      <div class="login-brand__descripcion">
        Sistema de Gestión de Censos Escolares
      </div>
      <div class="login-brand__mep">
        Ministerio de Educación Pública<br>
        Departamento de Estadística — DAE
      </div>
    </div>

    <!-- Panel derecho: formulario -->
    <div class="login-form-panel">
      <div class="login-card">

        <h1 class="login-card__titulo">Iniciar sesión</h1>
        <p class="login-card__subtitulo">
          Ingresá con tu cuenta institucional del MEP
        </p>

        <!-- Mensaje de error -->
        <div class="alert-error" id="alertaError" role="alert" aria-live="polite">
          <span id="mensajeError"></span>
        </div>

        <form id="formLogin" novalidate>
          <div class="mb-3">
            <label for="correo" class="form-label">
              Correo institucional
            </label>
            <input
              type="email"
              id="correo"
              name="correo"
              class="form-control"
              placeholder="usuario@mep.go.cr"
              autocomplete="email"
              required
              aria-required="true"
              aria-describedby="correoAyuda"
            />
            <div id="correoAyuda" class="sr-only">
              Ingresá tu correo institucional del MEP
            </div>
          </div>

          <div class="mb-4">
            <label for="contrasena" class="form-label">
              Contraseña
            </label>
            <input
              type="password"
              id="contrasena"
              name="contrasena"
              class="form-control"
              placeholder="••••••••"
              autocomplete="current-password"
              required
              aria-required="true"
            />
          </div>

          <button
            type="submit"
            class="btn-login"
            id="btnLogin"
            aria-label="Iniciar sesión en SICEN"
          >
            Ingresar
          </button>
        </form>

        <p class="text-center mt-4" style="font-size:0.8rem;color:var(--color-texto-suave);">
          ¿Problemas para ingresar?<br>
          Contactá al administrador del sistema.
        </p>

      </div>
    </div>

  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/auth.js"></script>
</body>
</html>
